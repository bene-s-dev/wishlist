<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <!-- Squircle Background -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)"/>
  
  <!-- Gift Box Body -->
  <path d="M28 54 H100 V102 C100 105 97 108 94 108 H34 C31 108 28 105 28 102 Z" fill="#FFFFFF"/>
  <rect x="56" y="54" width="16" height="54" fill="url(#goldGrad)"/>
  
  <!-- Gift Box Lid -->
  <rect x="22" y="44" width="84" height="14" rx="4" fill="#FFFFFF"/>
  <rect x="56" y="44" width="16" height="14" fill="url(#goldGrad)"/>
  
  <!-- Ribbon Loops -->
  <path d="M64 44 C56 26 36 24 38 36 C40 44 56 42 64 44 Z" fill="url(#goldGrad)"/>
  <path d="M64 44 C72 26 92 24 90 36 C88 44 72 42 64 44 Z" fill="url(#goldGrad)"/>
